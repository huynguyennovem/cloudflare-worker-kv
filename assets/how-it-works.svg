<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 112" width="930" height="112" role="img" aria-labelledby="title desc">
  <title id="title">How it works</title>
  <desc id="desc">The Flutter app sends GET /v1/config?template=default to the Cloudflare Worker. The Worker reads Workers KV, gets the value back, and replies to the app with 200 {version, entries} or 304.</desc>
  <style>
    .node-app { fill: #e8f1fe; stroke: #0969da; stroke-width: 1.5; }
    .node-cf { fill: #fff4e8; stroke: #f38020; stroke-width: 1.5; }
    .title { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .sub { fill: #59636e; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; text-anchor: middle; }
    .edge { fill: none; stroke: #8c959f; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #8c959f; }
    .pill { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .label { fill: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .node-app { fill: #0c2d57; stroke: #4493f8; }
      .node-cf { fill: #3b2210; }
      .title { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .pill { fill: #151b23; stroke: #3d444d; }
      .label { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Flutter app -->
  <rect class="node-app" x="10" y="16" width="180" height="80" rx="10"/>
  <text class="title" x="100" y="52">Flutter app</text>
  <text class="sub" x="100" y="71">flutter/ module</text>

  <!-- Cloudflare Worker -->
  <rect class="node-cf" x="470" y="16" width="180" height="80" rx="10"/>
  <text class="title" x="560" y="52">Cloudflare Worker</text>
  <text class="sub" x="560" y="71">worker/ module</text>

  <!-- Workers KV (cylinder) -->
  <path class="node-cf" d="M770 26 V86 A75 10 0 0 0 920 86 V26"/>
  <ellipse class="node-cf" cx="845" cy="26" rx="75" ry="10"/>
  <text class="title" x="845" y="60">Workers KV</text>
  <text class="sub" x="845" y="79">Cloudflare</text>

  <!-- Flutter app -> Worker: request -->
  <path class="edge" d="M190 40 H468" marker-end="url(#arrow)"/>
  <rect class="pill" x="208" y="11" width="244" height="22" rx="11"/>
  <text class="label" x="330" y="26">GET /v1/config?template=default</text>

  <!-- Worker -> Flutter app: response -->
  <path class="edge dashed" d="M470 72 H192" marker-end="url(#arrow)"/>
  <rect class="pill" x="215" y="80" width="230" height="22" rx="11"/>
  <text class="label" x="330" y="95">200 {version, entries} or 304</text>

  <!-- Worker -> KV: read -->
  <path class="edge" d="M650 40 H768" marker-end="url(#arrow)"/>
  <rect class="pill" x="685" y="11" width="50" height="22" rx="11"/>
  <text class="label" x="710" y="26">read</text>

  <!-- KV -> Worker: value -->
  <path class="edge dashed" d="M770 72 H652" marker-end="url(#arrow)"/>
  <rect class="pill" x="682" y="80" width="56" height="22" rx="11"/>
  <text class="label" x="710" y="95">value</text>
</svg>
